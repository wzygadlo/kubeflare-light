{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ratelimits.cloudflare.kubeflare.io
  labels:
    {{- include "kubeflare-light.labels" . | nindent 4 }}
  {{- if not .Values.crds.keep }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  group: cloudflare.kubeflare.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Zone
      type: string
      jsonPath: .spec.zoneId
    - name: Threshold
      type: integer
      jsonPath: .spec.threshold
    - name: Period
      type: integer
      jsonPath: .spec.period
    - name: Status
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - zoneId
            - threshold
            - period
            properties:
              zoneId:
                type: string
                description: Cloudflare zone identifier
              description:
                type: string
                description: Additional context for the rate limit rule
              match:
                type: object
                properties:
                  request:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      methods:
                        type: array
                        items:
                          type: string
                        description: HTTP methods to match
                      schemes:
                        type: array
                        items:
                          type: string
                        description: URL schemes to match (http, https)
                      urlPattern:
                        type: string
                        description: URL pattern to match
                      customExpression:
                        type: string
                        description: Raw Cloudflare expression to match
                  response:
                    type: object
                    properties:
                      statuses:
                        type: array
                        items:
                          type: integer
                        description: HTTP status codes to match
                      originTraffic:
                        type: boolean
                        description: Whether to match traffic from origin servers
              threshold:
                type: integer
                description: Rate limit threshold
              period:
                type: integer
                description: Time window for the rate limit in seconds
              action:
                type: object
                required:
                - mode
                properties:
                  mode:
                    type: string
                    enum: ["log", "block", "challenge", "js_challenge", "managed_challenge"]
                    description: Action mode
                  timeout:
                    type: integer
                    description: Timeout duration in seconds for ban action
                  response:
                    type: object
                    properties:
                      contentType:
                        type: string
                        description: Content type of the response
                      body:
                        type: string
                        description: Response body
              disabled:
                type: boolean
                description: Whether the rate limit rule is disabled
          status:
            type: object
            properties:
              cloudflareId:
                type: string
                description: ID of the rate limit rule in Cloudflare
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              observedGeneration:
                type: integer
                format: int64
                description: Most recently observed generation
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: ratelimits
    singular: ratelimit
    kind: RateLimit
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wafrules.cloudflare.kubeflare.io
  labels:
    {{- include "kubeflare-light.labels" . | nindent 4 }}
  {{- if not .Values.crds.keep }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  group: cloudflare.kubeflare.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Zone
      type: string
      jsonPath: .spec.zoneId
    - name: Action
      type: string
      jsonPath: .spec.action
    - name: Paused
      type: boolean
      jsonPath: .spec.paused
    - name: Status
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - zoneId
            - expression
            - action
            properties:
              zoneId:
                type: string
                description: Cloudflare zone identifier
              name:
                type: string
                description: Descriptive name for the WAF rule
              description:
                type: string
                description: Additional context for the WAF rule
              expression:
                type: string
                description: Wireshark-like filter expression
              action:
                type: string
                enum: ["allow", "block", "challenge", "js_challenge", "managed_challenge", "log", "skip"]
                description: Action to take when the rule matches
              priority:
                type: integer
                description: Rule priority (lower numbers are higher priority)
              paused:
                type: boolean
                description: Whether the rule is paused
              actionParameters:
                type: object
                properties:
                  id:
                    type: string
                    description: Action parameter ID
                  overrides:
                    type: object
                    additionalProperties: true
                    description: Rule overrides
                  response:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        description: HTTP status code
                      contentType:
                        type: string
                        description: Content type of the response
                      content:
                        type: string
                        description: Response content
          status:
            type: object
            properties:
              cloudflareId:
                type: string
                description: ID of the WAF rule in Cloudflare
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              observedGeneration:
                type: integer
                format: int64
                description: Most recently observed generation
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: wafrules
    singular: wafrule
    kind: WAFRule
{{- end }}
