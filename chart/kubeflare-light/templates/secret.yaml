{{- if and .Values.cloudflare.apiToken (not .Values.cloudflare.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeflare-light.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeflare-light.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.cloudflare.secretKey }}: {{ .Values.cloudflare.apiToken | b64enc }}
{{- end }}