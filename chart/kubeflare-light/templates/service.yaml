apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeflare-light.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeflare-light.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    {{- include "kubeflare-light.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller