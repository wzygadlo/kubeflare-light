---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cloudflare.io
  resources:
  - wafrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloudflare.io
  resources:
  - wafrules/finalizers
  verbs:
  - update
- apiGroups:
  - cloudflare.io
  resources:
  - wafrules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cloudflare.kubeflare.io
  resources:
  - ratelimits
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloudflare.kubeflare.io
  resources:
  - ratelimits/finalizers
  verbs:
  - update
- apiGroups:
  - cloudflare.kubeflare.io
  resources:
  - ratelimits/status
  verbs:
  - get
  - patch
  - update
