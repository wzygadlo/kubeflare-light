apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ratelimits.cloudflare.kubeflare.io
spec:
  group: cloudflare.kubeflare.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Zone
      type: string
      jsonPath: .spec.zoneId
    - name: Threshold
      type: integer
      jsonPath: .spec.threshold
    - name: Period
      type: integer
      jsonPath: .spec.period
    - name: Status
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - zoneId
            - threshold
            - period
            properties:
              zoneId:
                type: string
                description: Cloudflare zone identifier
              description:
                type: string
                description: Additional context for the rate limit rule
              match:
                type: object
                properties:
                  request:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      methods:
                        type: array
                        items:
                          type: string
                        description: HTTP methods to match
                      schemes:
                        type: array
                        items:
                          type: string
                        description: URL schemes to match (http, https)
                      urlPattern:
                        type: string
                        description: URL pattern to match
                      customExpression:
                        type: string
                        description: Raw Cloudflare expression to match
                  response:
                    type: object
                    properties:
                      statuses:
                        type: array
                        items:
                          type: integer
                        description: HTTP status codes to match
                      originTraffic:
                        type: boolean
                        description: Whether to match traffic from origin servers
              threshold:
                type: integer
                description: Rate limit threshold
              period:
                type: integer
                description: Time window for the rate limit in seconds
              action:
                type: object
                required:
                - mode
                properties:
                  mode:
                    type: string
                    enum: ["simulate", "log", "block", "challenge", "js_challenge", "managed_challenge"]
                    description: Action mode
                  timeout:
                    type: integer
                    description: Timeout duration in seconds for ban action
                  response:
                    type: object
                    properties:
                      contentType:
                        type: string
                        description: Content type of the response
                      body:
                        type: string
                        description: Response body
              disabled:
                type: boolean
                description: Whether the rate limit rule is disabled
          status:
            type: object
            properties:
              cloudflareId:
                type: string
                description: ID of the rate limit rule in Cloudflare
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              observedGeneration:
                type: integer
                format: int64
                description: Most recently observed generation
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: ratelimits
    singular: ratelimit
    kind: RateLimit
