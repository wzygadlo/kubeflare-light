apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ratelimits.cloudflare.io
spec:
  group: cloudflare.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - zoneId
            - name
            - match
            - threshold
            - period
            - action
            properties:
              zoneId:
                type: string
                description: Cloudflare zone identifier
              name:
                type: string
                description: Descriptive name for the rate limit rule
              description:
                type: string
                description: Additional context for the rate limit rule
              match:
                type: object
                properties:
                  request:
                    type: object
                    properties:
                      methods:
                        type: array
                        items:
                          type: string
                        description: HTTP methods to match
                      schemes:
                        type: array
                        items:
                          type: string
                        description: URL schemes to match (http, https)
                      urlPattern:
                        type: string
                        description: URL pattern to match
                  response:
                    type: object
                    properties:
                      statusCodes:
                        type: array
                        items:
                          type: integer
                        description: HTTP status codes to match
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                        description: Response headers to match
              threshold:
                type: integer
                description: Rate limit threshold
              period:
                type: integer
                description: Time window for the rate limit in seconds
              action:
                type: object
                required:
                - mode
                properties:
                  mode:
                    type: string
                    enum: ["simulate", "ban", "challenge", "js_challenge"]
                    description: Action mode
                  timeout:
                    type: integer
                    description: Timeout duration in seconds for ban action
                  response:
                    type: object
                    properties:
                      contentType:
                        type: string
                        description: Content type of the response
                      body:
                        type: string
                        description: Response body
              disabled:
                type: boolean
                description: Whether the rate limit rule is disabled
          status:
            type: object
            properties:
              cloudflareId:
                type: string
                description: ID of the rate limit rule in Cloudflare
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              observedGeneration:
                type: integer
                format: int64
                description: Most recently observed generation
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: ratelimits
    singular: ratelimit
    kind: RateLimit
