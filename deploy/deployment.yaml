apiVersion: v1
kind: Namespace
metadata:
  name: kubeflare-light-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflare-light-controller
  namespace: kubeflare-light-system
  labels:
    app: kubeflare-light-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeflare-light-controller
  template:
    metadata:
      labels:
        app: kubeflare-light-controller
    spec:
      serviceAccountName: kubeflare-light-controller
      containers:
      - name: manager
        image: kubeflare-light:latest
        imagePullPolicy: Always
        env:
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: token
        args:
        - --metrics-addr=0.0.0.0:8080
        - --enable-leader-election
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: kubeflare-light-system
type: Opaque
data:
  # Replace this with your base64-encoded Cloudflare API token
  token: ""
