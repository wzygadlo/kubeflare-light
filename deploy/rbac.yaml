apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeflare-light-controller
  namespace: kubeflare-light-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflare-light-manager-role
rules:
- apiGroups:
  - cloudflare.io
  resources:
  - ratelimits
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloudflare.io
  resources:
  - ratelimits/finalizers
  verbs:
  - update
- apiGroups:
  - cloudflare.io
  resources:
  - ratelimits/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cloudflare.io
  resources:
  - wafrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloudflare.io
  resources:
  - wafrules/finalizers
  verbs:
  - update
- apiGroups:
  - cloudflare.io
  resources:
  - wafrules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflare-light-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflare-light-manager-role
subjects:
- kind: ServiceAccount
  name: kubeflare-light-controller
  namespace: kubeflare-light-system
