apiVersion: cloudflare.kubeflare.io/v1alpha1
kind: WAFRule
metadata:
  name: block-malicious-ips
  namespace: default
spec:
  zoneId: "your-zone-id-here"
  description: "Block known malicious IP addresses and suspicious traffic"
  expression: '(ip.src in {192.0.2.1 192.0.2.2 198.51.100.0/24}) or (cf.threat_score gt 14)'
  action: "block"
  priority: 1
  paused: false
  actionParameters:
    response:
      statusCode: 403
      contentType: "application/json"
      content: '{"error": "Access denied", "reason": "Your IP has been blocked due to suspicious activity"}'
---
apiVersion: cloudflare.kubeflare.io/v1alpha1
kind: WAFRule
metadata:
  name: challenge-suspicious-requests
  namespace: default
spec:
  zoneId: "your-zone-id-here"
  description: "Challenge requests with suspicious or automated user agents"
  expression: '(http.user_agent contains "bot") or (http.user_agent contains "crawler") or (http.user_agent eq "")'
  action: "managed_challenge"
  priority: 2
  paused: false
